  model-versioning:
    name: Data & Model Versioning (DVC)
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Python & DVC
        run: |
          python -m pip install --upgrade pip
          pip install dvc

      - name: Install AWS CLI (for MinIO, which is S3-compatible)
        run: |
          pip install awscli

      - name: Download model from MinIO
        env:
          AWS_ACCESS_KEY_ID: "admin"  
          AWS_SECRET_ACCESS_KEY: "password"     
        run: |
          mkdir -p downloaded_models
          
          # 1. Verify MinIO pod status
          echo "Checking MinIO pod..."
          kubectl get pods -l app=minio -n default
          MINIO_POD=$(kubectl get pod -l app=minio -n default -o jsonpath='{.items[0].metadata.name}')
          kubectl logs $MINIO_POD -n default --tail=5
          
          # 2. Create temporary port-forward
          echo "Establishing port-forward..."
          kubectl port-forward svc/minio-service 9000:9000 -n default --address 0.0.0.0 > /dev/null 2>&1 &
          sleep 10  # Wait for port-forward stabilization
          
          # 3. Verify MinIO connectivity
          echo "Testing MinIO connection..."
          curl -sSf http://localhost:9000/minio/health/live || {
            echo "::error::MinIO health check failed"
            exit 1
          }
          
          # 4. Download with AWS CLI (using localhost via port-forward)
          echo "Downloading model..."
          aws --endpoint-url "http://localhost:9000" s3 cp \
            s3://models/stock_forex_price_prediction_model.zip \
            downloaded_models/stock_forex_price_prediction_model.zip || {
            echo "::error::Download failed"
            exit 1
          }
          
          # 5. Verify download
          if [ -s "downloaded_models/stock_forex_price_prediction_model.zip" ]; then
            echo "Download successful! Size: $(du -h downloaded_models/stock_forex_price_prediction_model.zip | cut -f1)"
          else
            echo "::error::Downloaded file is empty"
            exit 1
          fi
        

      - name: Track model with DVC
        run: |
          dvc add downloaded_models/stock_forex_price_prediction_model.zip
          git add downloaded_models/stock_forex_price_prediction_model.zip.dvc
          git add dvc.lock

          git commit -m "Add/Update model from MinIO via CI"
          git push

      - name: Push data/model to DVC remote
        run: |
          dvc push