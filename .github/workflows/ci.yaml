  model-versioning:
    name: Data & Model Versioning (DVC)
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Python & DVC
        run: |
          python -m pip install --upgrade pip
          pip install dvc

      - name: Install AWS CLI (for MinIO, which is S3-compatible)
        run: |
          pip install awscli

      - name: Download model from MinIO
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          mkdir -p downloaded_models
      
          aws --endpoint-url "${{ secrets.MINIO_ENDPOINT }}" s3 cp \
            s3://models/stock_forex_price_prediction_model.zip \
            downloaded_models/stock_forex_price_prediction_model.zip
        

      - name: Track model with DVC
        run: |
          # Add the newly downloaded file to DVC
          dvc add downloaded_models/stock_forex_price_prediction_model.zip

          # Stage the .dvc file(s) for commit
          git add downloaded_models/stock_forex_price_prediction_model.zip.dvc

          # Also stage changes to dvc.lock if it updated
          git add dvc.lock

          # Commit & push to your repo
          git commit -m "Add/Update model from MinIO via CI"
          git push

      - name: Push data/model to DVC remote
        run: |
          # Ensure .dvc/config is configured to point to your MinIO remote
          dvc push