  model-versioning:
    name: Data & Model Versioning (DVC)
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Python & DVC
        run: |
          python -m pip install --upgrade pip
          pip install dvc

      - name: Install AWS CLI (for MinIO, which is S3-compatible)
        run: |
          pip install awscli

      - name: Download model from MinIO
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          mkdir -p downloaded_models
          
          # First verify MinIO connectivity
          echo "Verifying MinIO connection..."
          if ! curl -sSf http://minio-service.default.svc.cluster.local:9000/minio/health/live; then
            echo "::error::Cannot connect to MinIO. Checking alternatives..."
            
            # Fallback to port-forward if direct connection fails
            kubectl port-forward svc/minio-service 9000:9000 --namespace=default &
            sleep 5
            export ENDPOINT_URL="http://localhost:9000"
          else
            export ENDPOINT_URL="http://minio-service.default.svc.cluster.local:9000"
          fi
          
          # Download with retries and checksum verification
          for i in {1..3}; do
            echo "Attempt $i to download model..."
            if aws --endpoint-url "$ENDPOINT_URL" s3 cp \
                s3://models/stock_forex_price_prediction_model.zip \
                downloaded_models/stock_forex_price_prediction_model.zip; then
                
              # Verify download integrity
              if [ $(stat -c%s "downloaded_models/stock_forex_price_prediction_model.zip") -lt 1000 ]; then
                echo "::warning::Downloaded file seems too small, retrying..."
                rm -f downloaded_models/stock_forex_price_prediction_model.zip
                continue
              fi
              echo "Download successful!"
              exit 0
            fi
            sleep $((i * 2)) # Exponential backoff
          done
          
          echo "::error::Failed to download model after 3 attempts"
          exit 1
        

      - name: Track model with DVC
        run: |
          dvc add downloaded_models/stock_forex_price_prediction_model.zip
          git add downloaded_models/stock_forex_price_prediction_model.zip.dvc
          git add dvc.lock

          git commit -m "Add/Update model from MinIO via CI"
          git push

      - name: Push data/model to DVC remote
        run: |
          dvc push