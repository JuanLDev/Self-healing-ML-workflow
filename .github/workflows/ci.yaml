name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: 'write'

jobs:
  build-and-push-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push data-fetch
        run: |
            docker build -t ${{ secrets.DOCKER_USERNAME }}/data-fetch:latest \
            -f ./data-fetch/Dockerfile.fetch ./data-fetch
            docker push ${{ secrets.DOCKER_USERNAME }}/data-fetch:latest

      - name: Build and push data-ingestion
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/data-ingestion:latest \
            -f ./data-ingestion/Dockerfile.ingestion ./data-ingestion
          docker push ${{ secrets.DOCKER_USERNAME }}/data-ingestion:latest

      - name: Build and push model-training
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/model-training:latest \
            -f ./model-training/Dockerfile.training ./model-training
          docker push ${{ secrets.DOCKER_USERNAME }}/model-training:latest

      - name: Build and push fastapi-model
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/fastapi-model:latest \
            -f ./model_api/Dockerfile ./model_api
          docker push ${{ secrets.DOCKER_USERNAME }}/fastapi-model:latest

  security-scan:
    name: Security Scan (Trivy & Snyk)
    runs-on: ubuntu-latest
    needs: build-and-push-docker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub (if private)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'docker.io/juanlugodev/fastapi-model:latest'
          severity: HIGH,CRITICAL
          exit-code: 1

      # - name: Run Snyk scan
      #   uses: snyk/actions/docker@master
      #   with:
      #     image: docker.io/juanlugodev/fastapi-model:latest
      #     args: --severity-threshold=high --file=./model_api/Dockerfile --exit-code=0
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deploy:
    name: Deploy to kubernetes
    runs-on: [self-hosted, minikube]
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: verify minikube
        run: |
          minikube status || minikube start --wait=all
          minikube update-context
          kubectl config view
          kubectl get pods

      # - name: Set up kubeconfig from secrets
      #   run: |
      #     mkdir -p ~/.kube
      #     chmod 600 ~/.kube/config
      #     kubectl config view
      #     kubectl config get-contexts

      - name: Verify cluster access
        run: |
          kubectl cluster-info
          kubectl get nodes

      # - name: Deploy to cluster
      #   run: |
      #     kubectl apply -f kubernetes/
      #     kubectl rollout status deployment/your-deployment --timeout=90s


  model-versioning:
    name: Data & Model Versioning (DVC)
    runs-on: [self-hosted, minikube]
    needs: deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Python & DVC
        run: |
          python -m pip install --upgrade pip
          pip install dvc

      - name: Install AWS CLI (for MinIO, which is S3-compatible)
        run: |
          pip install awscli

      - name: Download model from MinIO
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}  # From your MinIO deployment
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          # 1. Create directory structure
          mkdir -p downloaded_models
          
          # 2. Verify MinIO pod status
          echo "=== Checking MinIO pod ==="
          kubectl get pods -l app=minio -n default -o wide
          MINIO_POD=$(kubectl get pod -l app=minio -n default -o jsonpath='{.items[0].metadata.name}')
          
          # 3. Establish port-forward with health check
          echo "=== Starting port-forward ==="
          kubectl port-forward svc/minio-service 9000:9000 -n default --address 0.0.0.0 > /dev/null 2>&1 &
          sleep 10  # Wait for port-forward stabilization
          
          # Health check with retries
          for i in {1..3}; do
            if curl -sSf http://localhost:9000/minio/health/live; then
              echo "MinIO is responsive"
              break
            else
              echo "Attempt $i/3: MinIO not ready"
              sleep 5
            fi
          done
          
          # 4. Download with AWS CLI (using port-forward)
          echo "=== Downloading model ==="
          aws --endpoint-url http://localhost:9000 s3 cp \
            s3://models/stock_forex_price_prediction_model.zip \
            downloaded_models/model.zip \
            || (echo "::error::Download failed" && exit 1)
          
          # 5. Validate download
          echo "=== Verifying download ==="
          unzip -t downloaded_models/model.zip || (echo "::error::Corrupted download" && exit 1)
          echo "Downloaded size: $(du -h downloaded_models/model.zip | cut -f1)"
          
          # 6. Clean up port-forward
          pkill -f "port-forward" || true

      - name: Configure default DVC remote
        run: |
          dvc remote add -d minio-remote s3://models
          dvc remote modify minio-remote endpointurl http://localhost:9000
          dvc remote modify minio-remote access_key_id ${{ secrets.MINIO_ACCESS_KEY }}
          dvc remote modify minio-remote secret_access_key ${{ secrets.MINIO_SECRET_KEY }}
      
          # Optional: commit the .dvc/config so it stays in your repo
          git add .dvc/config
          git commit -m "Add default DVC remote in pipeline"
          git push
        
        

      - name: Track model with DVC
        run: |
          dvc add downloaded_models/model.zip
          git add downloaded_models/model.zip.dvc
          git commit -m "Add/Update model from MinIO"
          git push
        
      - name: Push data/model to DVC remote
        run: |
          dvc push
        